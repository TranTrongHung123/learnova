openapi: 3.1.0

info:
  title: Learnova API
  version: 1.0.0
  description: |
    API Contract cho hệ thống Learnova.

    Backend: Spring Boot
    Frontend: Next.js

    Lỗi dùng application/problem+json với code ổn định và fieldErrors.
    detail là thông báo an toàn cho người dùng; không có trường message trùng nghĩa.
    F03 bổ sung local authentication, refresh rotation và multi-role.
    F04 bổ sung Google OIDC, onboarding và liên kết Local account có xác nhận.
    F05 bổ sung profile, avatar và đổi mật khẩu Local giữ refresh session hiện tại.
    F06 bổ sung Classroom theo owner, membership và Join Code có preview trước khi join.
    Actuator không được expose qua HTTP. Endpoint chưa khai báo vẫn bị từ chối.
    Các list API dùng page/size và PageResponse; sort được định nghĩa riêng
    theo whitelist của từng endpoint, không nhận property persistence tùy ý.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Attempts
    description: F13 start, stable shuffle, resume and revision-checked autosave.
  - name: Participant Discovery
    description: F12 permission-filtered session metadata and own attempt history.
  - name: Exam Sessions
    description: F11 Creator session configuration, assignment and lifecycle.
  - name: Exams
    description: F09 Creator-owned Exam Builder, immutable snapshots and version history.
  - name: Question Imports
    description: F08 owner-scoped Excel preview and idempotent confirmation.
  - name: Questions
    description: F07 private Creator Question Bank, draft validation and archive/restore lifecycle.
  - name: Classrooms
    description: F06 classroom ownership, membership and join codes.
  - name: Authentication
    description: Local/Google authentication và multi-role. Refresh token chỉ truyền qua HttpOnly cookie.
  - name: Health
    description: API kiểm tra trạng thái hệ thống

paths:
  /api/v1/exam-sessions/{id}/attempts:
    post:
      tags: [Attempts]
      operationId: startAttempt
      summary: Start or return the existing IN_PROGRESS Attempt
      description: |
        ACTIVE PARTICIPANT required. Session lock serializes start, configuration and cancellation.
        Existing IN_PROGRESS is returned before checking assignment, including expired attempts awaiting F14.
        New attempts require current assignment, effective OPEN state and remaining attempts.
        Deadline and concrete question/option order are fixed at creation. All responses use Cache-Control no-store.
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '201':
          description: Created atomically with persisted question and option order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TakingAttempt'}
        '200':
          description: Existing Attempt; retries do not consume another attempt.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TakingAttempt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: FORBIDDEN, ACCOUNT_LOCKED/ACCOUNT_DISABLED or SESSION_NOT_ASSIGNED.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiProblem'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/AttemptConflict'}
        '503': {$ref: '#/components/responses/AttemptUnavailable'}
  /api/v1/attempts/{id}:
    get:
      tags: [Attempts]
      operationId: readAttempt
      summary: Resume own Attempt with saved state and fixed order
      description: |
        ACTIVE PARTICIPANT owner required; membership is not rechecked. Other owners return 404.
        Only editable attempts include questions. Expired or completed attempts return metadata,
        canEdit=false and questions=[]; no result disclosure or finalization occurs in F13.
        Cache-Control no-store. serverTime and deadline are authoritative, even when scheduler is late.
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Own Attempt; no correct answers, explanations or grading rules.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TakingAttempt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/AttemptUnavailable'}
  /api/v1/attempts/{id}/answers/{questionId}:
    put:
      tags: [Attempts]
      operationId: saveAttemptAnswer
      summary: Replace one answer and review state using its server revision
      description: |
        Owner, IN_PROGRESS and now < persisted deadline are checked while holding the Attempt lock.
        Question and option IDs must belong to its published snapshot. Revision is per question.
        Stale revision always returns ANSWER_REVISION_CONFLICT without writing; after a lost response,
        read the Attempt to reconcile before choosing whether to save again. No automatic overwrite.
        activeTimeMs is cumulative estimated focused time, nullable if absent; accepted values are
        capped to elapsed server time and never decrease. It is not grading or anti-cheat evidence.
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: questionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaveAttemptAnswer'}
      responses:
        '200':
          description: Persisted state and incremented revision; Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [state, serverTime]
                properties:
                  state: {$ref: '#/components/schemas/AttemptAnswerState'}
                  serverTime: {type: string, format: date-time}
        '400':
          description: INVALID_ATTEMPT_ANSWER, VALIDATION_FAILED or INVALID_REQUEST; invalid shape, precision or foreign/duplicate option IDs.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiProblem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: ATTEMPT_NOT_FOUND or ATTEMPT_QUESTION_NOT_FOUND, including other owners.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiProblem'}
        '409': {$ref: '#/components/responses/AttemptConflict'}
        '503': {$ref: '#/components/responses/AttemptUnavailable'}
  /api/v1/participant/exam-sessions:
    get:
      tags:
      - Participant Discovery
      operationId: listParticipantSessions
      summary: List accessible sessions by discovery tab
      description: 'ACTIVE PARTICIPANT required, including PUBLIC. Database filters
        current assignment or own attempt history. DRAFT/CANCELLED excluded. AVAILABLE:
        canStart or canContinue; UPCOMING: assigned and SCHEDULED; COMPLETED: own SUBMITTED/EXPIRED/GRADED;
        EXPIRED: CLOSED. Tabs may overlap. Effective state uses server time. Sort: AVAILABLE
        endTime ascending, UPCOMING startTime ascending, COMPLETED latest completion
        descending (submittedAt or deadline), EXPIRED endTime descending; id ascending
        breaks ties.'
      security:
      - bearerAuth: []
      parameters:
      - name: tab
        in: query
        schema:
          type: string
          enum:
          - AVAILABLE
          - UPCOMING
          - COMPLETED
          - EXPIRED
          default: AVAILABLE
      - &id003
        name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - &id004
        name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Participant-safe metadata only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryPage'
        '400': &id001
          $ref: '#/components/responses/SessionError'
        '401': *id001
        '403': *id001
        '404': *id001
        '503': *id001
  /api/v1/participant/exam-sessions/{id}:
    get:
      tags:
      - Participant Discovery
      operationId: getParticipantSession
      summary: Read participant session metadata and eligibility
      description: ACTIVE PARTICIPANT with current PUBLIC/CLASS ACTIVE membership/INDIVIDUAL
        assignment or own attempt. Missing/inaccessible/DRAFT/CANCELLED returns 404.
        canStart requires assignment, OPEN, remaining attempts and no IN_PROGRESS attempt.
        canContinue requires own IN_PROGRESS before its persisted deadline, independently
        of current membership. No question content, correct answer, explanation, earned
        score or pass/fail. Capability flags describe business eligibility; F12 does
        not implement Start/resume/result commands.
      security:
      - bearerAuth: []
      parameters:
      - &id002
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Participant-safe metadata only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredSession'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '503': *id001
  /api/v1/participant/exam-sessions/{id}/attempts:
    get:
      tags:
      - Participant Discovery
      operationId: listParticipantSessionAttempts
      summary: Read own attempt history metadata
      description: Same visibility checks as session detail. Only caller attempts, including
        after membership removal; sorted startedAt descending then id ascending. No
        answers, scores, pass/fail or result link. F13-F15 add write/resume/result flows.
      security:
      - bearerAuth: []
      parameters:
      - *id002
      - *id003
      - *id004
      responses:
        '200':
          description: Participant-safe metadata only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryAttemptPage'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '503': *id001
  /api/v1/exam-sessions:
    get:
      tags:
      - Exam Sessions
      operationId: listExamSessions
      summary: List owned exam sessions
      description: ACTIVE CREATOR only, owner scoped. Bearer authentication; no CSRF header. Timestamps require timezone
        and at most microsecond precision. State uses server time independently of scheduler lag; mutations recheck after locking. Mutation conflicts return 409; refetch and reconcile before retry. No question snapshots or answer keys
        are returned. Sorted updatedAt descending, then id descending. Filters use effective state, including CLOSED
        when scheduler has not run.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current authoritative session data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        '400':
          $ref: '#/components/responses/SessionError'
        '401':
          $ref: '#/components/responses/SessionError'
        '403':
          $ref: '#/components/responses/SessionError'
        '404':
          $ref: '#/components/responses/SessionError'
        '409':
          $ref: '#/components/responses/SessionError'
        '503':
          $ref: '#/components/responses/SessionError'
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - SCHEDULED
          - OPEN
          - CLOSED
          - CANCELLED
      - name: examId
        in: query
        schema:
          type: string
          format: uuid
      - name: classroomId
        in: query
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    post:
      tags:
      - Exam Sessions
      operationId: createExamSession
      summary: Create a configured Draft
      description: ACTIVE CREATOR only, owner scoped. Bearer authentication; no CSRF header. Timestamps require timezone
        and at most microsecond precision. State uses server time independently of scheduler lag; mutations recheck after locking. Mutation conflicts return 409; refetch and reconcile before retry. No question snapshots or answer keys
        are returned. Version must be published and belong to an unarchived owned Exam. startTime < endTime; duration
        may exceed the window. PUBLIC requires empty target arrays; CLASS requires 1..500 owned classrooms only; INDIVIDUAL
        requires 1..500 active onboarded PARTICIPANT users only. Duplicate IDs rejected. Defaults SUMMARY + AFTER_SESSION_END.
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Current authoritative session data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '400':
          $ref: '#/components/responses/SessionError'
        '401':
          $ref: '#/components/responses/SessionError'
        '403':
          $ref: '#/components/responses/SessionError'
        '404':
          $ref: '#/components/responses/SessionError'
        '409':
          $ref: '#/components/responses/SessionError'
        '503':
          $ref: '#/components/responses/SessionError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionWrite'
  /api/v1/exam-sessions/{id}:
    get:
      tags:
      - Exam Sessions
      operationId: getExamSession
      summary: Read owned session
      description: 'ACTIVE CREATOR only, owner scoped. Bearer authentication; no CSRF header. Timestamps require timezone
        and at most microsecond precision. State uses server time independently of scheduler lag; mutations recheck after locking. Mutation conflicts return 409; refetch and reconcile before retry. No question snapshots or answer keys
        are returned. '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current authoritative session data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '400':
          $ref: '#/components/responses/SessionError'
        '401':
          $ref: '#/components/responses/SessionError'
        '403':
          $ref: '#/components/responses/SessionError'
        '404':
          $ref: '#/components/responses/SessionError'
        '409':
          $ref: '#/components/responses/SessionError'
        '503':
          $ref: '#/components/responses/SessionError'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
      - Exam Sessions
      operationId: updateExamSession
      summary: Update configuration or title
      description: ACTIVE CREATOR only, owner scoped. Bearer authentication; no CSRF header. Timestamps require timezone
        and at most microsecond precision. State uses server time independently of scheduler lag; mutations recheck after locking. Mutation conflicts return 409; refetch and reconcile before retry. No question snapshots or answer keys
        are returned. Required revision. DRAFT without attempts permits full configuration edits. SCHEDULED without
        attempts permits edits before opening, with new startTime in future and unchanged endTime (use extend). OPEN
        or any existing attempt allows only title edits. CLOSED/CANCELLED are immutable. Changing version requires
        an unarchived owned Exam. Existing sessions survive archive.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current authoritative session data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '400':
          $ref: '#/components/responses/SessionError'
        '401':
          $ref: '#/components/responses/SessionError'
        '403':
          $ref: '#/components/responses/SessionError'
        '404':
          $ref: '#/components/responses/SessionError'
        '409':
          $ref: '#/components/responses/SessionError'
        '503':
          $ref: '#/components/responses/SessionError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionWrite'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/exam-sessions/participants/lookup:
    get:
      tags:
      - Exam Sessions
      operationId: lookupSessionParticipant
      summary: Find an eligible participant by exact email
      description: ACTIVE CREATOR only, owner scoped. Bearer authentication; no CSRF header. Timestamps require timezone
        and at most microsecond precision. State uses server time independently of scheduler lag; mutations recheck after locking. Mutation conflicts return 409; refetch and reconcile before retry. No question snapshots or answer keys
        are returned. Case-insensitive exact email; active onboarded PARTICIPANT only. Not a general user directory.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current authoritative session data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionParticipant'
        '400':
          $ref: '#/components/responses/SessionError'
        '401':
          $ref: '#/components/responses/SessionError'
        '403':
          $ref: '#/components/responses/SessionError'
        '404':
          $ref: '#/components/responses/SessionError'
        '409':
          $ref: '#/components/responses/SessionError'
        '503':
          $ref: '#/components/responses/SessionError'
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
          format: email
          maxLength: 254
  /api/v1/exam-sessions/{id}/schedule:
    post:
      tags:
      - Exam Sessions
      operationId: scheduleExamSession
      summary: DRAFT without attempts only
      description: ACTIVE CREATOR only, owner scoped. Bearer authentication; no CSRF header. Timestamps require timezone
        and at most microsecond precision. State uses server time independently of scheduler lag; mutations recheck after locking. Mutation conflicts return 409; refetch and reconcile before retry. No question snapshots or answer keys
        are returned. DRAFT without attempts only. Revalidates unarchived published version and targets. If startTime
        <= now < endTime, opens immediately. Expired window rejected.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current authoritative session data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '400':
          $ref: '#/components/responses/SessionError'
        '401':
          $ref: '#/components/responses/SessionError'
        '403':
          $ref: '#/components/responses/SessionError'
        '404':
          $ref: '#/components/responses/SessionError'
        '409':
          $ref: '#/components/responses/SessionError'
        '503':
          $ref: '#/components/responses/SessionError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRevision'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/exam-sessions/{id}/cancel:
    post:
      tags:
      - Exam Sessions
      operationId: cancelExamSession
      summary: DRAFT/SCHEDULED without attempts only; rejects OPEN/CLOSED/CANCELLED
      description: ACTIVE CREATOR only, owner scoped. Bearer authentication; no CSRF header. Timestamps require timezone
        and at most microsecond precision. State uses server time independently of scheduler lag; mutations recheck after locking. Mutation conflicts return 409; refetch and reconcile before retry. No question snapshots or answer keys
        are returned. DRAFT/SCHEDULED without attempts only; rejects OPEN/CLOSED/CANCELLED. Cancellation and audit
        commit together.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current authoritative session data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '400':
          $ref: '#/components/responses/SessionError'
        '401':
          $ref: '#/components/responses/SessionError'
        '403':
          $ref: '#/components/responses/SessionError'
        '404':
          $ref: '#/components/responses/SessionError'
        '409':
          $ref: '#/components/responses/SessionError'
        '503':
          $ref: '#/components/responses/SessionError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRevision'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/exam-sessions/{id}/extend-end-time:
    post:
      tags:
      - Exam Sessions
      operationId: extendExamSession
      summary: SCHEDULED/OPEN only; newEndTime must exceed current endTime
      description: ACTIVE CREATOR only, owner scoped. Bearer authentication; no CSRF header. Timestamps require timezone
        and at most microsecond precision. State uses server time independently of scheduler lag; mutations recheck after locking. Mutation conflicts return 409; refetch and reconcile before retry. No question snapshots or answer keys
        are returned. SCHEDULED/OPEN only; newEndTime must exceed current endTime. Does not reopen CLOSED sessions
        or alter any existing attempt deadline. Audit records old/new endTime, actor and timestamp. AFTER_SESSION_END
        uses new endTime.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current authoritative session data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '400':
          $ref: '#/components/responses/SessionError'
        '401':
          $ref: '#/components/responses/SessionError'
        '403':
          $ref: '#/components/responses/SessionError'
        '404':
          $ref: '#/components/responses/SessionError'
        '409':
          $ref: '#/components/responses/SessionError'
        '503':
          $ref: '#/components/responses/SessionError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionExtend'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/exam-versions/{id}/generation/preview:
    post:
      tags: [Exams]
      operationId: previewExamMatrix
      summary: Check whole-matrix candidate availability without changing the Draft
      description: |
        ACTIVE CREATOR owner only; bearer authentication, no CSRF header. Locks Exam then Version,
        checks DRAFT and revision, and excludes source IDs already in the Draft. Only ACTIVE owned
        questions qualify. Maximum matching prevents false shortages from intersecting rules.
        candidateCount counts each rule independently; allocatedCount accounts for all other rules.
        Earlier rules take priority when insufficient. Preview does not reserve candidates, save the
        matrix or change revision/timestamps. Generate must recheck. Archived Exams remain editable.
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExamMatrixRequest'}
      responses:
        '200':
          description: Availability at the time of reading; may report canGenerate false.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamMatrixPreview'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ExamMatrixForbidden'}
        '404': {$ref: '#/components/responses/ExamMatrixNotFound'}
        '409': {$ref: '#/components/responses/ExamMatrixConflict'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
  /api/v1/exam-versions/{id}/generation:
    post:
      tags: [Exams]
      operationId: generateExamMatrix
      summary: Append a complete random allocation as immutable question snapshots
      description: |
        Same authorization and candidate rules as preview. Locks Exam, Version, then selected sources
        in UUID order. Checks revision, source state and source revision before snapshotting. Randomizes
        candidate traversal before maximum matching; does not promise uniform sampling over all feasible
        allocations. Appends by rule order, preserving existing questions/points and assigning 1 point
        per new question. Increments Draft revision once. No partial write on any failure.
        EXAM_MATRIX_INSUFFICIENT_CANDIDATES includes availability; Draft and Exam remain unchanged.
        Source changes after candidate lookup return QUESTION_REVISION_CONFLICT / QUESTION_STATE_CONFLICT.
        A repeated successful command with its original revision returns EXAM_REVISION_CONFLICT.
        After uncertain response, read and review the Draft before issuing a new command. No automatic
        retry with a refreshed revision. Review/edit the generated Draft before publishing separately.
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExamMatrixRequest'}
      responses:
        '200':
          description: Authoritative saved Draft including appended snapshots.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamVersionDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ExamMatrixForbidden'}
        '404': {$ref: '#/components/responses/ExamMatrixNotFound'}
        '409': {$ref: '#/components/responses/ExamMatrixConflict'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
  /api/v1/exams:
    get:
      tags:
      - Exams
      operationId: listExams
      summary: List owned exams
      description: Defaults to ACTIVE; filters by status and case-insensitive literal name substring. Ordered by updatedAt
        DESC then id DESC. latestVersion is highest version number, not necessarily the latest published version. Requires
        bearer authentication and ACTIVE CREATOR ownership. Refresh cookies never authenticate these endpoints; no CSRF
        header is required. Unknown request fields are rejected.
      security:
      - bearerAuth: []
