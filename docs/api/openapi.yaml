      operationId: downloadQuestionImportTemplate
      summary: Download an empty Questions sheet and Instructions with four question-type examples
      security: [{bearerAuth: []}]
      description: ACTIVE account with current CREATOR role required, including completed onboarding. Bearer-only authentication.
      responses:
        '200':
          description: XLSX template, Cache-Control no-store; numeric columns use Text format to preserve precision in Excel.
          headers:
            Content-Disposition:
              schema: {type: string}
              example: attachment; filename=learnova-questions.xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ImportForbidden'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
  /api/v1/question-imports:
    post:
      tags: [Question Imports]
      operationId: previewQuestionImport
      summary: Upload and validate Excel without creating questions
      security: [{bearerAuth: []}]
      description: |
        Requires an ACTIVE, onboarded CREATOR. Upload does not create any Question.
        Accepts real, unencrypted .xlsx files up to 5 MiB; multipart request limit is 6 MiB.
        Questions sheet must have the exact template headers in order. Instructions is the only optional second sheet.
        Columns: type, content, explanation, difficulty, category, tags, option1 through option20,
        correctOptions, correctBoolean, correctValue, tolerance. No owner, score or status column.
        Tags and correct option indices use semicolons; indices are 1-based. Options must be contiguous.
        Question types and difficulty use the existing exact enum names; boolean accepts TRUE/FALSE case-insensitively.
        Numeric text uses decimal point, at most 20 integer and 10 fractional digits; no exponent or rounding.
        Numeric Excel cells are read from their stored XML decimal; precision already lost by Excel cannot be recovered.
        Leading/trailing whitespace is stripped; fully blank rows are ignored. Report original Excel row numbers.
        At most 1,000 nonblank question rows and 10,001 physical rows including the header.
        ZIP limits: 100 entries, 20 MiB per expanded entry, 50 MiB total; POI compression-ratio protection remains enabled.
        Macro/external-link workbooks, invalid headers and malformed files fail the upload.
        Formula/error cells and question validation failures become row errors; formulas are never evaluated.
        Cells exceeding 10,000 characters are invalid; only their first 10,000 characters appear in preview.
        All import rows require complete content/answers even though confirmation creates DRAFT questions.
        The server stores the immutable validated preview with owner and a 24-hour deadline; the original file is discarded.
        Each upload is a separate batch; no content-based deduplication or update of existing questions.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: Preview persisted; first 20 rows, filter ALL. No Question or question-created audit yet.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuestionImportPreview'}
        '400':
          description: IMPORT_INVALID_FILE, IMPORT_INVALID_TEMPLATE, IMPORT_EMPTY_FILE, IMPORT_TOO_MANY_ROWS, IMPORT_RESOURCE_LIMIT or INVALID_REQUEST. Row validation errors return 201 inside preview.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiProblem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ImportForbidden'}
        '413':
          description: IMPORT_FILE_TOO_LARGE for an oversized file; PAYLOAD_TOO_LARGE when the multipart request is rejected before controller selection.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiProblem'}
        '415':
          description: Request must use multipart/form-data.
          content:
            application/problem+json:
