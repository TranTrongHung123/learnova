          additionalProperties: {type: [string, 'null'], maxLength: 10000}
        question:
          description: Server-normalized complete DRAFT input for valid rows; null for invalid rows. Never accepted back in confirm requests.
          anyOf:
            - {$ref: '#/components/schemas/QuestionWrite'}
            - {type: 'null'}
        errors:
          type: array
          description: Empty means valid. Field names identify template columns or normalized question fields.
          items:
            type: object
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}
    QuestionImportPreview:
      type: object
      required: [importId, status, expiresAt, confirmedAt, totalRows, validRows, invalidRows, importedRows, skippedRows, content, page, size, totalElements, totalPages]
      properties:
        importId: {type: string, format: uuid}
        status: {type: string, enum: [READY, CONFIRMED]}
        expiresAt: {type: string, format: date-time}
        confirmedAt: {type: [string, 'null'], format: date-time}
        totalRows: {type: integer, minimum: 1, maximum: 1000}
        validRows: {type: integer, minimum: 0, maximum: 1000}
        invalidRows: {type: integer, minimum: 0, maximum: 1000}
        importedRows: {type: integer, minimum: 0, maximum: 1000, description: 'Zero before confirmation; validRows after confirmation.'}
        skippedRows: {type: integer, minimum: 0, maximum: 1000, description: 'Zero before confirmation; invalidRows after confirmation.'}
        content: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/QuestionImportRow'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    QuestionType:
      type: string
      enum: [SINGLE_CHOICE, MULTIPLE_CHOICE, TRUE_FALSE, NUMERIC_ANSWER]
    QuestionStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]
    QuestionDifficulty:
      type: [string, 'null']
      enum: [EASY, MEDIUM, HARD, null]
    QuestionOption:
      type: object
      additionalProperties: false
      description: Draft options may omit content/correct; ACTIVE requires nonblank content. Responses always include both fields.
      properties:
        content: {type: [string, 'null'], maxLength: 2000}
        correct: {type: boolean, default: false}
    QuestionWrite:
      type: object
      additionalProperties: false
      required: [type, status]
      description: |
        DRAFT may omit content/answers. ACTIVE requires nonblank content; choice questions
        need 2–20 nonblank options, SINGLE_CHOICE exactly one correct, MULTIPLE_CHOICE at least one.
        TRUE_FALSE requires correctBoolean; NUMERIC_ANSWER requires correctValue.
        Irrelevant answer fields are rejected. ACTIVE cannot return to DRAFT.
        revision is required on update and must be omitted on create.
        Tags are trimmed and deduplicated. Strings render as plain text.
      properties:
        type: {$ref: '#/components/schemas/QuestionType'}
        status: {type: string, enum: [DRAFT, ACTIVE]}
        content: {type: [string, 'null'], maxLength: 10000, default: ''}
        explanation: {type: [string, 'null'], maxLength: 10000}
        difficulty: {$ref: '#/components/schemas/QuestionDifficulty'}
        category: {type: [string, 'null'], maxLength: 100}
        tags:
          type: [array, 'null']
          maxItems: 20
          items: {type: string, minLength: 1, maxLength: 50}
        options:
          type: [array, 'null']
          maxItems: 20
          items: {$ref: '#/components/schemas/QuestionOption'}
        correctBoolean: {type: [boolean, 'null']}
        correctValue:
          type: [string, 'null']
          pattern: '^-?[0-9]+(\.[0-9]{1,10})?$'
          maxLength: 42
          description: Exact decimal string; at most 20 integer and 10 fractional digits. No exponent or rounding.
        tolerance:
          type: [string, 'null']
          pattern: '^[0-9]+(\.[0-9]{1,10})?$'
          maxLength: 42
          default: '0'
          description: Nonnegative absolute tolerance. Same precision as correctValue.
        revision: {type: [integer, 'null'], format: int64, minimum: 0}
    QuestionRevision:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: {type: integer, format: int64, minimum: 0}
    QuestionSummary:
      type: object
      required: [id, type, status, contentPreview, difficulty, category, tags, revision, updatedAt]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/QuestionType'}
        status: {$ref: '#/components/schemas/QuestionStatus'}
        contentPreview: {type: string, maxLength: 240}
        difficulty: {$ref: '#/components/schemas/QuestionDifficulty'}
        category: {type: [string, 'null']}
        tags: {type: array, items: {type: string}}
        revision: {type: integer, format: int64}
        updatedAt: {type: string, format: date-time}
    QuestionDetail:
      type: object
      required: [id, type, status, content, explanation, difficulty, category, tags, options, correctBoolean, correctValue, tolerance, revision, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/QuestionType'}
        status: {$ref: '#/components/schemas/QuestionStatus'}
        content: {type: string}
        explanation: {type: [string, 'null']}
        difficulty: {$ref: '#/components/schemas/QuestionDifficulty'}
        category: {type: [string, 'null']}
        tags: {type: array, items: {type: string}}
        options: {type: array, items: {$ref: '#/components/schemas/QuestionOption'}}
        correctBoolean: {type: [boolean, 'null']}
        correctValue: {type: [string, 'null']}
        tolerance: {type: string}
        revision: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    QuestionPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/QuestionSummary'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
    WriteClassroom:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed; must contain non-whitespace text.
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
          description: Plain text. Missing, blank or null clears the description.
      additionalProperties: false
    AddClassroomMember:
      type: object
      required:
      - userId
      properties:
        userId:
          type: string
          format: uuid
      additionalProperties: false
    ClassroomCodeRequest:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: Trimmed and uppercased. Never put the code in URLs or logs.
      additionalProperties: false
    ClassroomJoinCode:
      type: object
      required:
      - status
      - code
      - expiresAt
      properties:
        status:
          type: string
          enum:
          - NOT_CREATED
          - ACTIVE
          - EXPIRED
          - REVOKED
        code:
          type:
          - string
          - 'null'
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
      description: Only the owner detail and generate operation expose the current ACTIVE code. Code is null for NOT_CREATED,
        EXPIRED or REVOKED. expiresAt is null only for NOT_CREATED. Expiry is exclusive and decided by backend time.
    ClassroomSummary:
      type: object
      required:
      - id
      - name
      - description
      - activeParticipants
      - joinCodeStatus
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        activeParticipants:
          type: integer
          minimum: 0
        joinCodeStatus:
          type: string
          enum:
          - NOT_CREATED
          - ACTIVE
          - EXPIRED
          - REVOKED
        updatedAt:
          type: string
          format: date-time
    ClassroomDetail:
      type: object
      required:
      - id
      - name
      - description
      - activeParticipants
      - joinCode
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        activeParticipants:
          type: integer
          minimum: 0
        joinCode:
          $ref: '#/components/schemas/ClassroomJoinCode'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ClassroomParticipant:
      type: object
      required:
      - userId
      - email
      - displayName
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
    ClassroomMembership:
      type: object
      required:
      - id
      - classroomId
      - userId
      - status
      - joinedAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        classroomId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ACTIVE
          - REMOVED
        joinedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: joinedAt is the first join time; reactivation preserves id and joinedAt. updatedAt changes only on
        a state transition. Timestamps use microsecond precision.
    ClassroomMember:
      type: object
      required:
      - id
      - userId
      - email
      - displayName
      - status
      - joinedAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - REMOVED
        joinedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    JoinedClassroom:
      type: object
      required:
      - id
      - name
      - description
      - creatorName
      - joinedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        creatorName:
          type: string
        joinedAt:
          type: string
          format: date-time
    ClassroomPreview:
      type: object
      required:
      - id
      - name
      - description
      - creatorName
      - membershipStatus
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        creatorName:
          type: string
        membershipStatus:
          type:
          - string
          - 'null'
          enum:
          - ACTIVE
          - REMOVED
          - null
    ClassroomPage:
      allOf:
      - $ref: '#/components/schemas/PageResponse'
      - type: object
        properties:
          content:
            type: array
            items:
              $ref: '#/components/schemas/ClassroomSummary'
    ClassroomMemberPage:
      allOf:
      - $ref: '#/components/schemas/PageResponse'
      - type: object
        properties:
          content:
            type: array
            items:
              $ref: '#/components/schemas/ClassroomMember'
    JoinedClassroomPage:
      allOf:
      - $ref: '#/components/schemas/PageResponse'
      - type: object
        properties:
          content:
            type: array
            items:
              $ref: '#/components/schemas/JoinedClassroom'
    Profile:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [createdAt, hasLocalIdentity]
          properties:
            createdAt: {type: string, format: date-time}
            hasLocalIdentity: {type: boolean}
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          maxLength: 200
          description: Giới hạn đầu vào 200 UTF-16 code unit; sau strip phải có 1–100 Unicode code point.
        avatarUrl: {type: [string, 'null'], maxLength: 2048}
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, format: password, maxLength: 256, writeOnly: true}
        newPassword: {type: string, format: password, minLength: 12, maxLength: 128, writeOnly: true}
    RegisterRequest:
      type: object
      required: [email, password, displayName, roles]
      properties:
        email: {type: string, maxLength: 254, description: Email được strip/lowercase khi xử lý.}
        password: {type: string, format: password, minLength: 12, maxLength: 128, writeOnly: true}
        displayName: {type: string, minLength: 1, maxLength: 100}
        roles:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: {type: string, enum: [PARTICIPANT, CREATOR]}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, maxLength: 254}
        password: {type: string, format: password, maxLength: 256, writeOnly: true}
    UserSummary:
      type: object
      required: [id, email, displayName, avatarUrl, status, roles]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        displayName: {type: string}
        avatarUrl: {type: [string, 'null']}
        status: {type: string, enum: [ACTIVE, LOCKED, DISABLED]}
        roles:
          type: array
          uniqueItems: true
          items: {type: string, enum: [PARTICIPANT, CREATOR, ADMIN]}
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, expiresAt, user]
      properties:
        accessToken: {type: string}
        tokenType: {type: string, const: Bearer}
        expiresIn: {type: integer, const: 900}
        expiresAt: {type: string, format: date-time}
        user: {$ref: '#/components/schemas/UserSummary'}

    ApiProblem:
      type: object
      required: [type, title, status, detail, instance, code, fieldErrors]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
          description: Path của request, không chứa query string.
        code:
          type: string
          description: |
            Mã ổn định. F01: INVALID_REQUEST/VALIDATION_FAILED (400),
            AUTHENTICATION_REQUIRED (401), ACCESS_DENIED (403), RESOURCE_NOT_FOUND (404),
            METHOD_NOT_ALLOWED (405), NOT_ACCEPTABLE (406), CONFLICT (409),
            PAYLOAD_TOO_LARGE (413), UNSUPPORTED_MEDIA_TYPE (415), INTERNAL_ERROR (500),
            SERVICE_UNAVAILABLE (503); fallback REQUEST_REJECTED cho lỗi 4xx còn lại.
            Feature sau có thể bổ sung business code.
        fieldErrors:
          type: array
          description: Danh sách rỗng nếu không có lỗi theo field; không chứa giá trị đầu vào.
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    PageResponse:
      type: object
      description: |
        Envelope dùng chung; từng list operation phải khai báo schema item cụ thể
        trong content. Trang vượt tổng số trang trả content rỗng và giữ page yêu cầu.
        Kết quả rỗng có totalElements=0, totalPages=0. Không serialize Spring Page.
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: {}
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    HealthResponse:
      type: object
      additionalProperties: false

      required:
        - status

      properties:

        status:
          type: string
          enum: [UP]
          example: UP
