        '503': {$ref: '#/components/responses/AuthUnavailable'}
  /api/v1/question-imports/{importId}:
    get:
      tags: [Question Imports]
      operationId: getQuestionImportPreview
      summary: Resume an owned preview after reload
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/QuestionImportId'}
        - in: query
          name: filter
          schema: {type: string, enum: [ALL, VALID, INVALID], default: ALL}
        - in: query
          name: page
          schema: {type: integer, minimum: 0, maximum: 2147483647, default: 0}
        - in: query
          name: size
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      description: |
        Requires current CREATOR role and owner. Rows ordered by original rowNumber ascending.
        totalRows/validRows/invalidRows describe the whole batch; totalElements describes the filtered preview rows.
        READY expires after 24 hours based on server time, regardless of cleanup timing.
        CONFIRMED summary remains readable after expiry; content becomes empty once expired payload is cleaned.
      responses:
        '200': {$ref: '#/components/responses/QuestionImportPreview'}
        '400':
          description: INVALID_PAGINATION or INVALID_REQUEST for malformed UUID, page, size or filter.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiProblem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ImportForbidden'}
        '404': {$ref: '#/components/responses/ImportNotFound'}
        '410': {$ref: '#/components/responses/ImportExpired'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
  /api/v1/question-imports/{importId}/confirm:
    post:
      tags: [Question Imports]
      operationId: confirmQuestionImport
      summary: Atomically create DRAFT questions from the server preview
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/QuestionImportId'}
      description: |
        Requires ACTIVE, onboarded CREATOR and batch ownership. No CSRF header needed for this bearer-only API.
        Body is required; {} defaults to validRowsOnly=false. Unknown fields, including rows or ownerId, are rejected.
        If any row is invalid, validRowsOnly must explicitly be true; no valid rows always prevents confirmation.
        Uses only server-stored validated rows. Creates DRAFT questions and audits in the same transaction as CONFIRMED.
        Concurrent/repeated confirmation of the same importId returns its stored summary without creating duplicates.
        A CONFIRMED retry ignores the new validRowsOnly choice, including after payload expiry/cleanup.
        Failure rolls back all questions, audits and confirmation state. Response uses page 0, size 20, filter ALL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                validRowsOnly: {type: [boolean, 'null'], default: false, description: 'Omitted or null means false.'}
      responses:
        '200': {$ref: '#/components/responses/QuestionImportPreview'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ImportForbidden'}
        '404': {$ref: '#/components/responses/ImportNotFound'}
        '409':
          description: IMPORT_HAS_INVALID_ROWS without explicit opt-in; IMPORT_NO_VALID_ROWS when no rows can be imported.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiProblem'}
        '410': {$ref: '#/components/responses/ImportExpired'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
  /api/v1/questions:
