openapi: 3.1.0

info:
  title: Learnova API
  version: 1.0.0
  description: |
    API Contract cho hệ thống Learnova.

    Backend: Spring Boot
    Frontend: Next.js

    Lỗi dùng application/problem+json với code ổn định và fieldErrors.
    detail là thông báo an toàn cho người dùng; không có trường message trùng nghĩa.
    F03 bổ sung local authentication, refresh rotation và multi-role.
    F04 bổ sung Google OIDC, onboarding và liên kết Local account có xác nhận.
    Actuator không được expose qua HTTP. Endpoint chưa khai báo vẫn bị từ chối.
    Các list API sau này dùng Page/Size và PageResponse; sort được định nghĩa riêng
    theo whitelist của từng endpoint, không nhận property persistence tùy ý.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Authentication
    description: Local/Google authentication và multi-role. Refresh token chỉ truyền qua HttpOnly cookie.
  - name: Health
    description: API kiểm tra trạng thái hệ thống

paths:

  /api/v1/auth/google/config:
    get:
      tags: [Authentication]
      operationId: getGoogleAvailability
      summary: Kiểm tra cấu hình Google Login
      security: []
      responses:
        '200':
          description: Google Login đã được bật bằng cấu hình backend; không kiểm tra kết nối provider.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: {type: boolean}

  /api/v1/auth/google:
    get:
      tags: [Authentication]
      operationId: startGoogleLogin
      summary: Bắt đầu Google OIDC bằng browser navigation
      security: []
      description: |
        Redirect tới Google với scopes openid/email/profile, state, nonce và PKCE S256.
        Giao dịch Redis TTL 10 phút ràng buộc cookie learnova_google_flow HttpOnly, host-only,
        SameSite=Lax, Path=/api/v1/auth/google, Secure ở production. Flow mới hủy flow tạm cũ.
        Không nhận returnTo hoặc redirect_uri từ client. Khi chưa bật, redirect về frontend
        callback với error=GOOGLE_UNAVAILABLE. Không dùng fetch để bắt đầu OAuth.
      responses:
        '302':
          description: Redirect tới Google hoặc frontend callback lỗi.
          headers:
            Location: {schema: {type: string, format: uri}}
            Set-Cookie: {schema: {type: string}}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /api/v1/auth/google/callback:
    get:
      tags: [Authentication]
      operationId: receiveGoogleCallback
      summary: Backend nhận authorization code từ Google
      security: [{googleFlowCookie: []}]
      parameters:
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      description: |
        Chỉ nhận một trong code/error, kiểm tra browser binding/state một lần, đổi code server-side,
        xác minh chữ ký/issuer/audience/expiry/nonce và email_verified. Google sub là identity key.
        Identity đã link và onboarding hoàn tất nhận Learnova refresh cookie; user mới hoặc email
        trùng nhận flow tạm. Redirect về /auth/google/callback của frontend đã cấu hình.
        Không đưa Learnova token/pending credential vào URL, không lưu Google tokens lâu dài.
        Lỗi redirect chỉ chứa code an toàn: GOOGLE_AUTH_FAILED, GOOGLE_EMAIL_UNVERIFIED,
        GOOGLE_IDENTITY_INVALID, GOOGLE_IDENTITY_CONFLICT, ACCOUNT_LOCKED, ACCOUNT_DISABLED,
        SERVICE_UNAVAILABLE. Endpoint callback không bật khi Google Login chưa được cấu hình.
      responses:
        '302':
          description: Frontend đọc flow hoặc gọi refresh; callback lỗi có query error an toàn.
          headers:
            Location: {schema: {type: string, format: uri}}
            Set-Cookie: {schema: {type: string}}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/auth/google/flow:
    get:
      tags: [Authentication]
      operationId: getGoogleFlow
      summary: Đọc trạng thái Google flow của browser
      security: [{googleFlowCookie: []}]
      responses:
        '200':
          description: Trạng thái authoritative; no-store, không trả userId/subject/token.
          content:
            application/json:
              schema:
                type: object
                required: [state, email]
                properties:
                  state: {type: string, enum: [ONBOARDING, LINK_REQUIRED, LINK_CONFIRMATION]}
                  email: {type: string, format: email}
        '401': {$ref: '#/components/responses/GoogleFlowUnauthorized'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /api/v1/auth/google/onboarding:
    post:
      tags: [Authentication]
      operationId: completeGoogleOnboarding
      summary: Hoàn tất vai trò cho Google User mới
      security: [{googleFlowCookie: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      description: |
        Chỉ ONBOARDING flow. Không nhận userId; role không được ghi đè sau khi onboarding hoàn tất.
        Consume flow một lần, khóa User và ghi audit cùng transaction; sau commit cấp refresh cookie.
        Client gọi refresh nhận access token. Nếu mất response, đọc lại flow rồi refresh;
        nếu không còn flow/session, bắt đầu Google Login lại để phục hồi từ database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  minItems: 1
                  maxItems: 2
                  uniqueItems: true
                  items: {type: string, enum: [PARTICIPANT, CREATOR]}
      responses:
        '204': {$ref: '#/components/responses/GoogleCompleted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/GoogleFlowUnauthorized'}
        '403': {$ref: '#/components/responses/AuthForbidden'}
        '409': {$ref: '#/components/responses/GoogleFlowConflict'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /api/v1/auth/google/link/verify:
    post:
      tags: [Authentication]
      operationId: verifyGoogleLinkAccount
      summary: Xác minh mật khẩu Local account trước khi link
      security: [{googleFlowCookie: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      description: |
        Email/User lấy từ pending flow. Chỉ LINK_REQUIRED chuyển sang LINK_CONFIRMATION;
        chưa tạo identity hoặc cấp session. Tối đa 5 lần xác minh mỗi flow, không gia hạn TTL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, maxLength: 256, writeOnly: true}
      responses:
        '204': {description: Đã xác minh; cần xác nhận link riêng.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/GoogleFlowUnauthorized'}
        '403': {$ref: '#/components/responses/AuthForbidden'}
        '409': {$ref: '#/components/responses/GoogleFlowConflict'}
        '429':
          description: GOOGLE_LINK_ATTEMPTS_EXCEEDED; bắt đầu Google Login lại.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiProblem'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /api/v1/auth/google/link/confirm:
    post:
      tags: [Authentication]
      operationId: confirmGoogleLinkAccount
      summary: Xác nhận thêm Google Identity vào Local User đã xác minh
      security: [{googleFlowCookie: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      description: |
        Chỉ LINK_CONFIRMATION. Consume flow một lần; recheck User ACTIVE và identity uniqueness.
        Không chuyển identity của User khác, không ghi đè profile/role/password. Audit cùng transaction.
        Nếu DB đã commit nhưng session thất bại, Google Login lần sau dùng identity đã liên kết.
      responses:
        '204': {$ref: '#/components/responses/GoogleCompleted'}
        '401': {$ref: '#/components/responses/GoogleFlowUnauthorized'}
        '403': {$ref: '#/components/responses/AuthForbidden'}
        '409': {$ref: '#/components/responses/GoogleFlowConflict'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /api/v1/auth/google/cancel:
    post:
      tags: [Authentication]
      operationId: cancelGoogleFlow
      summary: Hủy flow Google tạm của browser
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      description: Idempotent; xóa flow/cookie, không xóa User hoặc identity đã tạo, không logout phiên Learnova khác.
      responses:
        '204': {description: Flow đã hủy hoặc không còn tồn tại.}
        '403': {$ref: '#/components/responses/CsrfForbidden'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Lấy token bảo vệ thao tác auth
      security: []
      description: |
        Set XSRF-TOKEN host-only HttpOnly cookie, Path=/api/v1/auth, SameSite=Lax,
        Secure ở production. Gửi token JSON trong headerName của các POST auth tiếp theo.
        Không tạo HttpSession. CORS chỉ cho frontend origin trong allowlist; dùng credentials=include.
      responses:
        '200':
          description: Token CSRF được che bằng cơ chế BREACH của Spring Security; không cache.
          content:
            application/json:
              schema:
                type: object
                required: [headerName, token]
                properties:
                  headerName: {type: string, const: X-XSRF-TOKEN}
                  token: {type: string}

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      operationId: registerLocalUser
      summary: Đăng ký tài khoản Local
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      description: |
        Tạo User ACTIVE, roles và Local Identity trong một transaction. Email strip/lowercase,
        không bỏ dấu chấm hoặc phần +tag. Reject ADMIN/role không biết, không tự cấp session.
        Password giữ nguyên Unicode/khoảng trắng, 12–128 Unicode code point; không ép composition.
        Display name strip, không rỗng, tối đa 100 UTF-16 code unit.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: Đăng ký thành công; frontend chuyển Login.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSummary'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/CsrfForbidden'}
        '409':
          description: EMAIL_ALREADY_EXISTS, bao gồm đăng ký đồng thời cùng email chuẩn hóa.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiProblem'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: loginLocalUser
      summary: Đăng nhập bằng email/password
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      description: |
        Chỉ User ACTIVE được cấp session. Sai password hoặc không có Local Identity trả cùng lỗi.
        Kiểm tra status sau xác minh password. Thu hồi session cũ của cookie hiện tại trước khi cấp session mới.
        JWT HS256 TTL 900 giây; chỉ lưu memory, không đưa vào URL hoặc browser storage.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/AuthTokens'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthUnauthorized'}
        '403': {$ref: '#/components/responses/AuthForbidden'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshAuthentication
      summary: Rotate refresh token và cấp access token mới
      security: [{refreshCookie: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      description: |
        Không cần bearer. Session có deadline cố định 7 ngày từ login, không gia hạn khi rotate.
        Redis chỉ giữ SHA-256 token và metadata. Rotation atomic; USED token được giữ đến deadline.
        Reuse revoke family và trả 401. Hai request cùng token: một rotate thành công, request còn lại
        revoke cả family, bao gồm token vừa được cấp. Client dùng shared Promise/Web Locks để tránh race.
        Kiểm tra User ACTIVE; lỗi auth xóa cookie. Lỗi hạ tầng không được coi là đã logout.
      responses:
        '200': {$ref: '#/components/responses/AuthTokens'}
        '401': {$ref: '#/components/responses/AuthUnauthorized'}
        '403': {$ref: '#/components/responses/AuthForbidden'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Thông tin User hiện tại
      security: [{bearerAuth: []}]
      description: User từ JWT subject; đọc roles/status hiện tại trong database. ADMIN không suy ra business role khác.
      responses:
        '200':
          description: User ACTIVE hiện tại.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AuthForbidden'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutCurrentSession
      summary: Đăng xuất session hiện tại
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      description: |
        Cookie learnova_refresh là tùy chọn. Thu hồi session được xác định bởi cookie, kể cả token USED.
        Idempotent: cookie thiếu/hết hạn/không hợp lệ vẫn trả 204. Xóa cookie cùng Path/SameSite/Secure.
        JWT đã cấp vẫn có thể dùng đến expiry tối đa 15 phút. Lỗi Redis không được báo thành công.
      responses:
        '204':
          description: Session đã bị thu hồi hoặc không tồn tại; clear refresh cookie.
        '403': {$ref: '#/components/responses/CsrfForbidden'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /api/v1/auth/logout-all:
    post:
      tags: [Authentication]
      operationId: logoutAllSessions
      summary: Đăng xuất tất cả thiết bị của User hiện tại
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      description: |
        Actor từ bearer subject, không nhận userId trong payload. Revoke mọi refresh session hiện có
        bằng index User và operation Redis atomic. Không quét toàn Redis; clear cookie hiện tại.
        Login mới sau operation được phép tạo session mới. JWT đã cấp còn hiệu lực đến expiry.
      responses:
        '204':
          description: Đã thu hồi các refresh session hiện có và clear refresh cookie.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfForbidden'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}

  /api/v1/health:
    get:
      tags:
        - Health

      summary: Kiểm tra trạng thái backend

      operationId: getHealth
      security: []
      description: |
        Xác nhận ứng dụng đang phục vụ HTTP (liveness), không kiểm tra readiness
        của PostgreSQL/Redis và không trả dependency details hoặc phiên bản.

      responses:

        "200":
          description: Backend đang hoạt động bình thường

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

              example:
                status: UP

components:

  securitySchemes:
    googleFlowCookie:
      type: apiKey
      in: cookie
      name: learnova_google_flow
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: learnova_refresh

  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Token từ GET /auth/csrf, kèm cookie XSRF-TOKEN của cùng browser.
      schema: {type: string}
    Page:
      name: page
      in: query
      description: Trang bắt đầu từ 0. Chỉ nhận một số nguyên không âm; sai trả 400.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 2147483647
        default: 0
    Size:
      name: size
      in: query
      description: Kích thước trang. Rỗng, lặp tham số, không nguyên hoặc ngoài giới hạn trả 400.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    GoogleCompleted:
      description: Clear flow cookie, set learnova_refresh HttpOnly cookie như Local Login; gọi POST /auth/refresh để lấy access token.
      headers:
        Set-Cookie: {schema: {type: string}}
    GoogleFlowUnauthorized:
      description: GOOGLE_FLOW_EXPIRED khi cookie/flow thiếu, hết hạn hoặc đã consume; INVALID_CREDENTIALS nếu mật khẩu sai.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ApiProblem'}
    GoogleFlowConflict:
      description: GOOGLE_FLOW_CHANGED khi thao tác không khớp state hoặc xảy ra đồng thời; GOOGLE_IDENTITY_CONFLICT khi identity không thể link.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ApiProblem'}
    AuthTokens:
      description: |
        Token mới; Cache-Control no-store. Set learnova_refresh HttpOnly, host-only,
        SameSite=Lax, Path=/api/v1/auth, Secure ở production. Max-Age bằng phần còn lại của session 7 ngày.
      headers:
        Set-Cookie:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TokenResponse'}
    AuthUnauthorized:
      description: INVALID_CREDENTIALS, INVALID_REFRESH_TOKEN, REFRESH_REUSED hoặc AUTHENTICATION_REQUIRED.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ApiProblem'}
    CsrfForbidden:
      description: CSRF_INVALID khi thiếu/sai CSRF token. CORS origin lạ bị từ chối trước controller.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ApiProblem'}
    AuthForbidden:
      description: ACCOUNT_LOCKED, ACCOUNT_DISABLED hoặc CSRF_INVALID; không có session mới.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ApiProblem'}
    AuthUnavailable:
      description: SERVICE_UNAVAILABLE khi database/Redis không phục vụ được; không khẳng định logout thành công.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ApiProblem'}
    BadRequest:
      description: INVALID_REQUEST hoặc VALIDATION_FAILED; không trả rejectedValue.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: The request is invalid.
            instance: /api/v1/questions
            code: VALIDATION_FAILED
            fieldErrors:
              - field: size
                message: Must be between 1 and 100.
    Unauthorized:
      description: AUTHENTICATION_REQUIRED; không redirect đến login.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Forbidden:
      description: ACCESS_DENIED, bao gồm CSRF không hợp lệ.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    NotFound:
      description: RESOURCE_NOT_FOUND khi request đã qua kiểm tra Security.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    InternalError:
      description: INTERNAL_ERROR; không chứa stack trace, SQL hay exception message.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName, roles]
      properties:
        email: {type: string, maxLength: 254, description: Email được strip/lowercase khi xử lý.}
        password: {type: string, format: password, minLength: 12, maxLength: 128, writeOnly: true}
        displayName: {type: string, minLength: 1, maxLength: 100}
        roles:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: {type: string, enum: [PARTICIPANT, CREATOR]}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, maxLength: 254}
        password: {type: string, format: password, maxLength: 256, writeOnly: true}
    UserSummary:
      type: object
      required: [id, email, displayName, status, roles]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        displayName: {type: string}
        status: {type: string, enum: [ACTIVE, LOCKED, DISABLED]}
        roles:
          type: array
          uniqueItems: true
          items: {type: string, enum: [PARTICIPANT, CREATOR, ADMIN]}
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, expiresAt, user]
      properties:
        accessToken: {type: string}
        tokenType: {type: string, const: Bearer}
        expiresIn: {type: integer, const: 900}
        expiresAt: {type: string, format: date-time}
        user: {$ref: '#/components/schemas/UserSummary'}

    ApiProblem:
      type: object
      required: [type, title, status, detail, instance, code, fieldErrors]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
          description: Path của request, không chứa query string.
        code:
          type: string
          description: |
            Mã ổn định. F01: INVALID_REQUEST/VALIDATION_FAILED (400),
            AUTHENTICATION_REQUIRED (401), ACCESS_DENIED (403), RESOURCE_NOT_FOUND (404),
            METHOD_NOT_ALLOWED (405), NOT_ACCEPTABLE (406), CONFLICT (409),
            PAYLOAD_TOO_LARGE (413), UNSUPPORTED_MEDIA_TYPE (415), INTERNAL_ERROR (500),
            SERVICE_UNAVAILABLE (503); fallback REQUEST_REJECTED cho lỗi 4xx còn lại.
            Feature sau có thể bổ sung business code.
        fieldErrors:
          type: array
          description: Danh sách rỗng nếu không có lỗi theo field; không chứa giá trị đầu vào.
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    PageResponse:
      type: object
      description: |
        Envelope dùng chung; từng list operation phải khai báo schema item cụ thể
        trong content. Trang vượt tổng số trang trả content rỗng và giữ page yêu cầu.
        Kết quả rỗng có totalElements=0, totalPages=0. Không serialize Spring Page.
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: {}
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    HealthResponse:
      type: object
      additionalProperties: false

      required:
        - status

      properties:

        status:
          type: string
          enum: [UP]
          example: UP
