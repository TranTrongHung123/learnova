  /api/v1/classrooms:
    get:
      tags:
      - Classrooms
      operationId: listOwnedClassrooms
      summary: List classrooms owned by the Creator
      description: CREATOR only. Search by case-insensitive name substring; literal percent/underscore. Ordered updatedAt
        descending then id. No join-code value in list. Requires bearer authentication; refresh cookies never authenticate
        these endpoints. No CSRF header is required for this bearer-only API. Unknown body fields are rejected.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomPage'
        '400':
          description: VALIDATION_FAILED, invalid path/query/pagination, or JOIN_CODE_INVALID for an unknown, expired,
            regenerated or revoked code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: FORBIDDEN for a missing business role; ACCOUNT_LOCKED, ACCOUNT_DISABLED or ONBOARDING_REQUIRED
            for current account restrictions.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '404':
          description: CLASSROOM_NOT_FOUND for missing/not-owned classroom; PARTICIPANT_NOT_FOUND for unavailable
            lookup/add target; MEMBERSHIP_NOT_FOUND for missing membership.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: SERVICE_UNAVAILABLE. Retry after recovery.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
