openapi: 3.1.0

info:
  title: Learnova API
  version: 1.0.0
  description: |
    API Contract cho hệ thống Learnova.

    Backend: Spring Boot
    Frontend: Next.js

    Lỗi dùng application/problem+json với code ổn định và fieldErrors.
    detail là thông báo an toàn cho người dùng; không có trường message trùng nghĩa.
    F03 bổ sung local authentication, refresh rotation và multi-role.
    F04 bổ sung Google OIDC, onboarding và liên kết Local account có xác nhận.
    F05 bổ sung profile, avatar và đổi mật khẩu Local giữ refresh session hiện tại.
    F06 bổ sung Classroom theo owner, membership và Join Code có preview trước khi join.
    Actuator không được expose qua HTTP. Endpoint chưa khai báo vẫn bị từ chối.
    Các list API dùng page/size và PageResponse; sort được định nghĩa riêng
    theo whitelist của từng endpoint, không nhận property persistence tùy ý.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Questions
    description: F07 private Creator Question Bank, draft validation and archive/restore lifecycle.
  - name: Classrooms
    description: F06 classroom ownership, membership and join codes.
  - name: Authentication
    description: Local/Google authentication và multi-role. Refresh token chỉ truyền qua HttpOnly cookie.
  - name: Health
    description: API kiểm tra trạng thái hệ thống

paths:
  /api/v1/questions:
    get:
      tags: [Questions]
      operationId: listQuestions
      summary: List owned questions
      security:
        - bearerAuth: []
      description: |
        ACTIVE account with CREATOR role and resource ownership required. Other owners return 404.
        Bearer-only API; refresh cookies do not authenticate it and no CSRF header is required.
        Unknown body fields are rejected. Mutations are transactional with audit and revision checks.
        Default excludes ARCHIVED; sort updatedAt DESC then id DESC. Keyword is a case-insensitive
        literal content substring, category case-insensitive exact match, tag case-sensitive exact match.
        Filters combine with AND. List never includes answers or explanation.
      parameters:
        - in: query
          name: keyword
          schema: {type: string, maxLength: 200}
        - in: query
          name: type
          schema: {$ref: '#/components/schemas/QuestionType'}
        - in: query
          name: difficulty
          schema: {$ref: '#/components/schemas/QuestionDifficulty'}
        - in: query
          name: category
          schema: {type: string, maxLength: 100}
        - in: query
          name: tag
          schema: {type: string, maxLength: 50}
        - in: query
          name: status
          schema: {$ref: '#/components/schemas/QuestionStatus'}
        - in: query
          name: page
          schema: {type: integer, minimum: 0, default: 0}
        - in: query
          name: size
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuestionPage'}
        '400':
          description: 'VALIDATION_FAILED or INVALID_REQUEST; invalid type, numeric precision, answer shape or pagination. Field errors identify invalid inputs.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiProblem'}
        '401':
          description: 'AUTHENTICATION_REQUIRED'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiProblem'}
        '403':
          description: 'FORBIDDEN, ACCOUNT_LOCKED, ACCOUNT_DISABLED or ONBOARDING_REQUIRED'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiProblem'}
        '404':
          description: 'QUESTION_NOT_FOUND; includes resources belonging to another Creator.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiProblem'}
        '409':
          description: 'QUESTION_REVISION_CONFLICT or QUESTION_STATE_CONFLICT; refetch before deciding how to retry.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiProblem'}
        '503':
          description: 'SERVICE_UNAVAILABLE'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiProblem'}
    post:
      tags: [Questions]
      operationId: createQuestion
      summary: Create a draft or active question
      security:
        - bearerAuth: []
      description: |
        ACTIVE account with CREATOR role and resource ownership required. Other owners return 404.
        Bearer-only API; refresh cookies do not authenticate it and no CSRF header is required.
        Unknown body fields are rejected. Mutations are transactional with audit and revision checks.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuestionWrite'}
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuestionDetail'}
        '400':
          description: 'VALIDATION_FAILED or INVALID_REQUEST; invalid type, numeric precision, answer shape or pagination. Field errors identify invalid inputs.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiProblem'}
        '401':
          description: 'AUTHENTICATION_REQUIRED'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiProblem'}
        '403':
          description: 'FORBIDDEN, ACCOUNT_LOCKED, ACCOUNT_DISABLED or ONBOARDING_REQUIRED'
          content:
