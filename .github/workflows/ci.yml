name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B verify


  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Setup Java for auth browser integration
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x backend/mvnw

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Auth browser integration with PostgreSQL and Redis
        working-directory: frontend
        run: npm run test:auth

      - name: Google browser integration with test OIDC provider
        working-directory: frontend
        run: npm run test:google

      - name: Classroom browser integration with PostgreSQL and Redis
        working-directory: frontend
        run: npm run test:classroom

      - name: Question Bank browser integration with PostgreSQL and Redis
        working-directory: frontend
        run: npm run test:question

      - name: Excel import browser integration with PostgreSQL and Redis
        working-directory: frontend
        run: npm run test:import

      - name: Exam Builder browser integration with PostgreSQL and Redis
        working-directory: frontend
        run: npm run test:exam

      - name: Session browser integration with PostgreSQL and Redis
        working-directory: frontend
        run: npm run test:session

      - name: Participant discovery browser integration with PostgreSQL and Redis
        working-directory: frontend
        run: npm run test:discovery

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Production route tests
        working-directory: frontend
        run: npm run test:production
